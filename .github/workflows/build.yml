# .github/workflows/build.yml
# CI/CD pipeline for Compose Manager plugin
#
# This workflow automates the release process:
# - Builds TXZ package using Docker (Slackware)
# - Calculates MD5 for integrity verification
# - Creates GitHub releases with package attached
# - Updates PLG file version/MD5 in the target branch (main or dev)
#
# Triggers:
# - Called by tag-release.yml via workflow_call (primary path)
# - Direct tag push (fallback / legacy)
# - Manual workflow_dispatch for testing builds
#
# Tag format:
# - Stable: vYYYY.MM.DD or vYYYY.MM.DDa
# - Beta:   vYYYY.MM.DD.HHMM

name: Build & Release Plugin

on:
  push:
    tags:
      - "v20[0-9][0-9].[0-9][0-9].[0-9][0-9]*"
  workflow_call:
    inputs:
      tag:
        description: "The full tag name (e.g., v2026.03.15.1234)"
        required: true
        type: string
  workflow_dispatch:
    inputs:
      version:
        description: "Version to build (e.g., 2026.02.01 or 2026.02.01.1430) - leave empty for test build"
        required: false
        default: ""

permissions:
  contents: write

concurrency:
  group: build-${{ inputs.tag || github.ref_name }}
  cancel-in-progress: false

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'
  PLUGIN_NAME: compose.manager
  HOST_WORKSPACE_ROOT: ${{ github.workspace }}
  HOST_SOURCE_PATH: ${{ github.workspace }}/source
  HOST_ARCHIVE_PATH: ${{ github.workspace }}/archive
  HOST_CACHE_PATH: ${{ github.workspace }}/archive/.build-cache

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.VERSION }}
      build: ${{ steps.version.outputs.BUILD }}
      md5: ${{ steps.hash.outputs.MD5 }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          ref: ${{ inputs.tag || github.ref }}
          fetch-depth: 0

      - name: Read component versions
        run: |
          while IFS='=' read -r key value; do
            [[ "$key" =~ ^#.*$ || -z "$key" ]] && continue
            echo "$key=$value" >> "$GITHUB_ENV"
          done < versions.env

      - name: Determine version
        id: version
        run: |
          if [[ -n "${{ inputs.tag }}" ]]; then
            # Called from tag-release.yml via workflow_call
            VERSION="${{ inputs.tag }}"
            VERSION="${VERSION#v}"  # strip 'v' prefix
          elif [[ "${{ github.event_name }}" == "push" && "${{ github.ref }}" == refs/tags/v* ]]; then
            # Direct tag push
            VERSION="${GITHUB_REF#refs/tags/v}"
          elif [[ -n "${{ github.event.inputs.version }}" ]]; then
            # Manual input
            VERSION="${{ github.event.inputs.version }}"
          else
            # Test build - use date + git SHA
            VERSION="$(date +%Y.%m.%d).$(git rev-parse --short HEAD)"
          fi
          echo "VERSION=${VERSION}" >> $GITHUB_OUTPUT
          echo "Building version: ${VERSION}"

          # Extract or generate BUILD timestamp (HHMM)
          # Beta versions have it as the 4th segment: YYYY.MM.DD.HHMM
          if [[ "$VERSION" =~ ^[0-9]{4}\.[0-9]{2}\.[0-9]{2}\.([0-9]+)$ ]]; then
            BUILD="${BASH_REMATCH[1]}"
          else
            export TZ="America/New_York"
            BUILD=$(date +%H%M)
          fi
          echo "BUILD=${BUILD}" >> $GITHUB_OUTPUT
          echo "Package build: ${BUILD}"

      - name: Build TXZ package in Docker
        run: |
          VERSION="${{ steps.version.outputs.VERSION }}"
          BUILD="${{ steps.version.outputs.BUILD }}"

          # Set executable permissions
          chmod +x ./build_in_docker.sh
          chmod +x ./source/pkg_build.sh

          # Build using the Slackware Docker container
          docker run --rm --tmpfs /tmp \
            -v $PWD/archive:/mnt/output:rw \
            -v $PWD/source:/mnt/source:ro \
            -v /etc/ssl/certs/ca-certificates.crt:/etc/ssl/certs/ca-certificates.crt:ro \
            -e TZ="America/New_York" \
            -e COMPOSE_VERSION="$COMPOSE_VERSION" \
            -e RESVG_VERSION="$RESVG_VERSION" \
            -e RESVG_SHA256="$RESVG_SHA256" \
            -e OUTPUT_FOLDER="/mnt/output" \
            -e PKG_VERSION="${VERSION}" \
            -e PKG_BUILD="${BUILD}" \
            -e CA_CERT="/etc/ssl/certs/ca-certificates.crt" \
            vbatts/slackware:latest /mnt/source/pkg_build.sh

          # Verify package was created
          ls -la ./archive/
          PACKAGE_NAME="${{ env.PLUGIN_NAME }}-${VERSION}-noarch-${BUILD}.txz"
          if [[ ! -f "./archive/${PACKAGE_NAME}" ]]; then
            echo "ERROR: Package not found!"
            exit 1
          fi
          echo "PACKAGE_PATH=./archive/${PACKAGE_NAME}" >> $GITHUB_ENV
          echo "Built package: ${PACKAGE_NAME}"

      - name: Calculate hash
        id: hash
        run: |
          PACKAGE="${{ env.PACKAGE_PATH }}"

          MD5=$(md5sum "$PACKAGE" | cut -d' ' -f1)
          echo "MD5=${MD5}" >> $GITHUB_OUTPUT
          echo "Package MD5: ${MD5}"

      - name: Upload build artifacts
        uses: actions/upload-artifact@v7
        with:
          name: plugin-package
          path: |
            archive/*.txz
            archive/release_info
          retention-days: 30

  release:
    needs: build
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v') || inputs.tag != ''

    steps:
      - name: Determine release type
        id: release_type
        run: |
          VERSION="${{ needs.build.outputs.version }}"
          # Beta versions have 4 dot-segments: YYYY.MM.DD.HHMM
          # Stable versions have 3: YYYY.MM.DD (optionally with letter suffix)
          if [[ "$VERSION" =~ ^[0-9]{4}\.[0-9]{2}\.[0-9]{2}\.[0-9]+ ]]; then
            echo "is_beta=true" >> $GITHUB_OUTPUT
            echo "target_branch=dev" >> $GITHUB_OUTPUT
            echo "prerelease=true" >> $GITHUB_OUTPUT
            echo "Release type: BETA (dev branch)"
          else
            echo "is_beta=false" >> $GITHUB_OUTPUT
            echo "target_branch=main" >> $GITHUB_OUTPUT
            echo "prerelease=false" >> $GITHUB_OUTPUT
            echo "Release type: STABLE (main branch)"
          fi

      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          ref: ${{ steps.release_type.outputs.target_branch }}
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Download artifacts
        uses: actions/download-artifact@v8
        with:
          name: plugin-package
          path: artifacts/

      - name: Prepare release notes
        id: notes
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VERSION="${{ needs.build.outputs.version }}"
          TARGET_BRANCH="${{ steps.release_type.outputs.target_branch }}"
          IS_BETA="${{ steps.release_type.outputs.is_beta }}"

          # Read component versions from release_info
          if [[ -f artifacts/release_info ]]; then
            COMPONENTS=$(cat artifacts/release_info)
          else
            COMPONENTS="See release artifacts for component versions"
          fi

          # Beta-specific: find PR and latest stable tag for diff link
          PR_SECTION=""
          if [[ "$IS_BETA" == "true" ]]; then
            TITLE="Compose Manager v${VERSION} (Beta)"
            INSTALL_NOTE="**Beta Release** - Install from the beta channel for testing."

            PR_NUMBER=$(gh pr list --repo "${{ github.repository }}" --head dev --base main --state open --json number --jq '.[0].number // empty')
            LATEST_STABLE=$(git tag -l 'v*' | grep -vP '^v\d{4}\.\d{2}\.\d{2}\.\d{4}' | sort -V | tail -1)

            if [[ -n "$PR_NUMBER" || -n "$LATEST_STABLE" ]]; then
              PR_SECTION=$'\n### Links\n'
              if [[ -n "$PR_NUMBER" ]]; then
                PR_SECTION+="- [PR #${PR_NUMBER}](https://github.com/${{ github.repository }}/pull/${PR_NUMBER})"$'\n'
              fi
              if [[ -n "$LATEST_STABLE" ]]; then
                PR_SECTION+="- [Beta release diff](https://github.com/${{ github.repository }}/compare/${LATEST_STABLE}...v${VERSION})"$'\n'
              fi
            fi
          else
            TITLE="Compose Manager v${VERSION}"
            INSTALL_NOTE=""
          fi

          # Create release body
          cat > release_body.md << EOF
          ## ${TITLE}

          ${INSTALL_NOTE}
          ${PR_SECTION}

          ### Installation

          **Via Plugin Manager:**
          \`\`\`
          https://raw.githubusercontent.com/${{ github.repository }}/${TARGET_BRANCH}/${{ env.PLUGIN_NAME }}.plg
          \`\`\`

          ### Package Details
          - **MD5:** \`${{ needs.build.outputs.md5 }}\`

          ### Components
          ${COMPONENTS}
          EOF

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.tag || github.ref_name }}
          name: "Compose Manager v${{ needs.build.outputs.version }}${{ steps.release_type.outputs.is_beta == 'true' && ' (Beta)' || '' }}"
          body_path: release_body.md
          files: |
            artifacts/*.txz
          fail_on_unmatched_files: true
          draft: false
          prerelease: ${{ steps.release_type.outputs.prerelease == 'true' }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Update PLG in target branch
        run: |
          VERSION="${{ needs.build.outputs.version }}"
          MD5="${{ needs.build.outputs.md5 }}"
          BUILD="${{ needs.build.outputs.build }}"
          TARGET_BRANCH="${{ steps.release_type.outputs.target_branch }}"

          # Configure git
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          # Update version, MD5, and build number in PLG
          sed -i \
            -e "s|<!ENTITY version.*\".*\"|<!ENTITY version     \"${VERSION}\"|" \
            -e "s|<!ENTITY packageMD5.*\".*\"|<!ENTITY packageMD5  \"${MD5}\"|" \
            -e "s|<!ENTITY pkgBUILD.*\".*\"|<!ENTITY pkgBUILD    \"${BUILD}\"|" \
            ${{ env.PLUGIN_NAME }}.plg

          echo "Updated PLG file:"
          head -20 ${{ env.PLUGIN_NAME }}.plg

          # Commit and push
          git add ${{ env.PLUGIN_NAME }}.plg
          git commit -m "Release v${VERSION} [skip ci]" || echo "No changes to commit"
          git pull --rebase origin ${TARGET_BRANCH}
          git push origin ${TARGET_BRANCH}
